<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070b14" />
  <title>RisApp JSBridge 调试 — dev-page</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../../assets/css/pages.css">
</head>
<body>
  <nav class="topnav">
    <a href="../../index.html" class="topnav-back">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Dev Tools
    </a>
    <div class="topnav-brand">
      <span class="brand-mark">DT</span>
      <span class="brand-name">RisApp Dev</span>
    </div>
  </nav>
  <div class="page-wrap">
    <header class="page-header">
      <div class="page-eyebrow">App Bridge · risapp</div>
      <h1 class="page-title">Risapp <em>Dev</em> Test</h1>
      <p class="page-subtitle">RisApp WebView JSBridge 调试 · golemonWebview</p>
    </header>

    <!-- UA -->
    <div class="p-section">
      <div class="p-section-title">User Agent</div>
      <div class="p-divider"></div>
      <button class="p-btn p-btn-teal" onclick="testAlert()" style="max-width: 200px;">
        显示 UA
      </button>
    </div>

    <!-- 核心接口 -->
    <div class="p-section">
      <div class="p-section-title">核心接口</div>
      <div class="p-divider"></div>
      <div class="p-btn-grid">
        <button class="p-btn p-btn-accent" onclick="destroyPage()">destroyPage</button>
        <button class="p-btn" onclick="login()">login</button>
        <button class="p-btn" onclick="getBaseInfo()">getBaseInfo</button>
      </div>
    </div>
  </div>

  <script type="text/javascript">
    var isiOS = !!navigator.userAgent.match(/\(i[^;]+;( U;)? CPU.+Mac OS X/);

    function destroyPage() {
      var actionData = {cmd: 'destroyPage', params: {p1: 'xx1', p2: 'xx2'}};
      if (isiOS) {
        try {
          window.webkit.messageHandlers.golemonWebview.postMessage(actionData);
        } catch (error) {
          console.error('ios context not exist ');
        }
      } else {
        window.golemonWebview && window.golemonWebview.destroyPage();
        console.log(actionData);
      }
    }

    function login() {
      var actionData = {cmd: 'login'};
      if (isiOS) {
        try {
          window.webkit.messageHandlers.golemonWebview.postMessage(actionData);
        } catch (error) {
          console.error('ios context not exist ');
        }
      } else {
        console.log(actionData);
      }
    }

    function getBaseInfo() {
      var actionData = {cmd: 'getBaseInfo'};
      if (isiOS) {
        try {
          window.webkit.messageHandlers.golemonWebview.postMessage(actionData);
        } catch (error) {
          console.error('ios context not exist ');
        }
      } else {
        console.log(actionData);
      }
    }

    function getBaseInfoResult(str) {
      asyncAlert(str);
    }

    function asyncAlert(content) {
      setTimeout(function () { alert(content); }, 1);
    }

    function testAlert() {
      alert(navigator.userAgent);
    }
  </script>

  <!-- QR Code Button -->
  <button class="qr-btn" aria-label="Show QR code"></button>
  <script src="../../assets/js/qrcode.js"></script>

</body>
</html>
